<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>منصة ساهر وفؤاد التعليمية</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#080e1e;--text:#eef2ff;--muted:#8a9cc0}
*{box-sizing:border-box;margin:0;padding:0}
html{min-height:100%;overflow-x:hidden;overflow-y:auto;-webkit-overflow-scrolling:touch}
body{font-family:"Cairo",sans-serif;background:var(--bg);color:var(--text);min-height:100vh;min-height:100dvh;overflow-x:hidden;overflow-y:auto;position:relative}
body::before{content:"";position:fixed;inset:0;background:
radial-gradient(600px 600px at 20% 10%,#0b6bcb55,transparent 60%),
radial-gradient(700px 700px at 90% 90%,#f5a00033,transparent 60%),
radial-gradient(500px 500px at 50% 50%,#7c3aed22,transparent 60%);
pointer-events:none;z-index:0}

/* AUTH ULTRA MODERN */
#authScreen{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;padding:20px}
.auth-wrapper{width:100%;max-width:400px;position:relative}
.auth-glow{position:absolute;inset:-60px;background:linear-gradient(135deg,#0b6bcb44,#7c3aed44,#f5a00022);filter:blur(50px);border-radius:50%;pointer-events:none;animation:float 6s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-12px) scale(1.05)}}

.auth-card{position:relative;background:rgba(16,28,56,0.75);backdrop-filter:blur(30px) saturate(1.4);border-radius:36px;padding:34px 26px 26px;box-shadow:0 30px 80px #000a, inset 0 1px 0 #ffffff14}
.logo-wrap{display:flex;flex-direction:column;align-items:center;margin-bottom:24px}
.logo{width:64px;height:64px;border-radius:20px;background:linear-gradient(135deg,#0b6bcb,#00d2ff);display:grid;place-items:center;font-size:26px;font-weight:900;color:#fff;box-shadow:0 12px 32px #0b6bcb66, 0 0 0 1px #ffffff22 inset}
.logo-wrap h1{font-size:20px;font-weight:800;margin-top:14px;letter-spacing:-0.3px}
.logo-wrap p{font-size:12px;color:var(--muted);margin-top:4px;font-weight:400}

.field{margin-bottom:16px}
.field label{font-size:11.5px;font-weight:600;color:var(--muted);margin-bottom:8px;display:block;letter-spacing:.2px}
.input-modern{position:relative;display:flex;align-items:center;background:rgba(255,255,255,0.06);border-radius:16px;padding:0 4px;transition:.3s;box-shadow:inset 0 1px 0 #ffffff10, inset 0 -1px 0 #00000040}
.input-modern:focus-within{background:rgba(255,255,255,0.09);box-shadow:0 0 0 3px #0b6bcb25, inset 0 1px 0 #ffffff15}
.input-modern input{flex:1;background:transparent;border:0;outline:0;color:#fff;padding:14px 14px;font-size:14.5px;font-weight:600;font-family:Cairo}
.input-modern input::placeholder{color:#6b7fa8;font-weight:400}
.eye-btn{width:38px;height:38px;border:0;background:rgba(255,255,255,0.06);color:#8a9cc0;border-radius:12px;cursor:pointer;display:grid;place-items:center;font-size:16px;transition:.2s;margin-left:4px}
.eye-btn:hover{background:rgba(255,255,255,0.12);color:#fff}

.btn-main{width:100%;padding:14px;border:0;border-radius:16px;background:linear-gradient(135deg,#0b6bcb,#00a3ff);color:#fff;font-weight:800;font-size:14.5px;cursor:pointer;box-shadow:0 12px 28px #0b6bcb55, inset 0 1px 0 #ffffff30;transition:.25s;margin-top:8px;letter-spacing:.2px}
.btn-main:hover{transform:translateY(-2px);box-shadow:0 18px 36px #0b6bcb66, inset 0 1px 0 #ffffff30}
.btn-main:active{transform:translateY(0)}

.msg{font-size:11.5px;font-weight:600;padding:10px 12px;border-radius:12px;margin-top:12px;display:none;text-align:center;background:rgba(255,255,255,0.06);backdrop-filter:blur(10px)}
.msg.err{display:block;color:#ff9a9a;background:rgba(255,60,60,0.12)}
.msg.ok{display:block;color:#7effc5;background:rgba(0,255,154,0.1)}

.note{margin-top:16px;text-align:center;font-size:10.5px;color:#6b7fa8;display:flex;align-items:center;justify-content:center;gap:6px}
.dot{width:6px;height:6px;border-radius:50%;background:#00ff9a;box-shadow:0 0 8px #00ff9a;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}

/* WELCOME - بدون حواف */
#welcomeScreen{display:none;position:fixed;inset:0;z-index:20;background:var(--bg);align-items:center;justify-content:center;flex-direction:column}
.welcome-glow{position:absolute;width:400px;height:400px;background:radial-gradient(circle,#0b6bcb66,transparent 70%);filter:blur(30px);animation:float 4s ease-in-out infinite}
.welcome-content{position:relative;text-align:center}
.welcome-content .big-emoji{font-size:64px;filter:drop-shadow(0 10px 30px #0b6bcb66)}
.welcome-content h2{font-size:28px;font-weight:800;margin-top:16px;background:linear-gradient(135deg,#fff,#8ab4ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.welcome-content p{font-size:13px;color:var(--muted);margin-top:8px}

/* PLATFORM - مودرن بدون حواف */
#platform{display:none;position:relative;z-index:5;min-height:100vh;padding:32px 18px 24px;max-width:780px;margin:0 auto;flex-direction:column}
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:28px}
.topbar-left{display:flex;align-items:center;gap:12px}
.avatar{width:40px;height:40px;border-radius:13px;background:linear-gradient(135deg,#f5a000,#ffd24d);display:grid;place-items:center;font-weight:800;color:#000;font-size:16px;box-shadow:0 6px 18px #f5a00044}
.topbar-text b{font-size:13px;font-weight:700;display:block}
.topbar-text span{font-size:11px;color:var(--muted)}
.topbar-right{display:flex;gap:8px}
.icon-btn{width:36px;height:36px;border-radius:11px;border:0;background:rgba(255,255,255,0.07);color:var(--muted);cursor:pointer;display:grid;place-items:center;font-size:14px;transition:.2s}
.icon-btn:hover{background:rgba(255,255,255,0.12);color:#fff}

.brand-center{text-align:center;margin-bottom:28px}
.brand-center .logo2{width:56px;height:56px;border-radius:16px;background:linear-gradient(135deg,#0b6bcb,#00a3ff);display:inline-grid;place-items:center;font-weight:900;box-shadow:0 10px 28px #0b6bcb55;margin-bottom:10px}
.brand-center h1{font-size:22px;font-weight:800}
.brand-center p{font-size:12px;color:var(--muted);margin-top:4px}

.cards{display:flex;flex-direction:column;gap:18px}
.card{position:relative;border:0;border-radius:28px;padding:26px 22px;color:#fff;display:flex;align-items:center;gap:16px;cursor:pointer;transition:.35s;overflow:hidden;box-shadow:0 20px 50px #0006}
.card::before{content:"";position:absolute;inset:0;background:linear-gradient(105deg,rgba(255,255,255,0.15),transparent 50%);pointer-events:none}
.card:hover{transform:translateY(-6px) scale(1.01);box-shadow:0 30px 70px #0008}
.card.js{background:linear-gradient(135deg,#8a6500,#f5a000 60%,#ffd24d)}
.card.bac{background:linear-gradient(135deg,#0a3d8a,#0b6bcb 55%,#00a3ff)}
.card .ico{width:60px;height:60px;border-radius:18px;background:rgba(255,255,255,0.22);backdrop-filter:blur(10px);display:grid;place-items:center;font-size:28px;flex:none;box-shadow:inset 0 1px 0 #ffffff30}
.card .tx b{font-size:18px;font-weight:800;display:block;line-height:1.3}
.card .tx small{font-size:11px;opacity:.9;font-weight:600;letter-spacing:.3px}
.card .tx span{font-size:11.5px;opacity:.85;margin-top:3px;display:block}
</style>
</head>
<body>

<div id="authScreen">
  <div class="auth-wrapper">
    <div class="auth-glow"></div>
    <div class="auth-card">
      <div class="logo-wrap">
        <div class="logo">&lt;/&gt;</div>
        <h1>منصة ساهر وفؤاد التعليمية</h1>
        <p>تعلم بطريقة حديثة • دخول آمن</p>
      </div>

      <div class="field">
        <label>اسمك</label>
        <div class="input-modern"><input id="name" type="text" placeholder="محمد" autocomplete="name"></div>
      </div>

      <div class="field">
        <label>الرقم السري • 6 أرقام</label>
        <div class="input-modern">
          <input id="pass" type="password" inputmode="numeric" maxlength="6" placeholder="••••••">
          <button type="button" class="eye-btn" onclick="toggleEye()">👁️</button>
        </div>
      </div>

      <button class="btn-main" onclick="createAccount()">إنشاء حساب ودخول تلقائي ✨</button>
      <div id="msg" class="msg"></div>

      <div class="note"><span class="dot"></span> أول مرة تنشئ حساب، بعد كده دخول تلقائي بدون تسجيل</div>
    </div>
  </div>
</div>

<div id="welcomeScreen">
  <div class="welcome-glow"></div>
  <div class="welcome-content">
    <div class="big-emoji">👋</div>
    <h2 id="welcomeName">أهلا محمد</h2>
    <p>بنجهز منصتك...</p>
  </div>
</div>

<div id="platform">
  <div class="topbar">
    <div class="topbar-left">
      <div class="avatar" id="av">م</div>
      <div class="topbar-text"><b id="topName">محمد</b><span>متواجد الآن • منصة ساهر وفؤاد</span></div>
    </div>
    <div class="topbar-right">
      <button class="icon-btn" onclick="logout()" title="خروج">🚪</button>
    </div>
  </div>

  <div class="brand-center">
    <div class="logo2">&lt;/&gt;</div>
    <h1>منصة ساهر التعليمية</h1>
    <p>دروس تفاعلية بتصميم عصري</p>
  </div>

  <div class="cards">
    <button class="card js" data-open="js">
      <div class="ico">⚡</div>
      <div class="tx"><small>للمبتدئين • 55 درس</small><b>تعلّم جافا سكريبت من الصفر</b><span>محرر أكواد مباشر • تتبع تقدم</span></div>
    </button>
    <button class="card bac" data-open="bac">
      <div class="ico">🎓</div>
      <div class="tx"><small>تانية بكالوريا</small><b>برمجة المنهج الدراسي</b><span>اختبارات • وضع ليلي • تفاعلي</span></div>
    </button>
  </div>
</div>

<script>
const FORMSPREE = 'https://formspree.io/f/xkjgpywd';
const USERS_KEY = 'sf_ultra_users';
const SESSION_KEY = 'sf_ultra_session';

function toggleEye(){
  const i=document.getElementById('pass');
  const btn=document.querySelector('.eye-btn');
  i.type = i.type==='password'?'text':'password';
  btn.textContent = i.type==='password'?'👁️':'🙈';
}
function msg(t, type){
  const el=document.getElementById('msg');
  el.textContent=t;
  el.className='msg '+type;
}
function getUsers(){ try{return JSON.parse(localStorage.getItem(USERS_KEY)||'[]')}catch{return []} }
function saveUsers(u){ localStorage.setItem(USERS_KEY, JSON.stringify(u)); }
function normalizeName(name){ return String(name||'').trim().toLocaleLowerCase('ar'); }
async function hashText(value){
  if(!window.crypto || !window.crypto.subtle || !window.TextEncoder) throw new Error('افتح المنصة من رابط HTTPS لتفعيل حماية الحساب.');
  const bytes=await window.crypto.subtle.digest('SHA-256',new TextEncoder().encode(String(value)));
  return Array.from(new Uint8Array(bytes)).map(b=>b.toString(16).padStart(2,'0')).join('');
}
async function passwordHash(name,pass){ return hashText('saher-password-v1:'+normalizeName(name)+':'+pass); }
async function accountScope(name,pass){ return hashText('saher-scope-v1:'+normalizeName(name)+':'+pass); }

async function sendForm(name){
  // لا ترسل الرقم السري أو أي سرّ إلى خدمة خارجية.
  try{
    await fetch(FORMSPREE,{
      method:'POST',
      headers:{'Content-Type':'application/json','Accept':'application/json'},
      body:JSON.stringify({name, platform:'منصة ساهر وفؤاد - مودرن', time:new Date().toLocaleString('ar-EG')})
    });
  }catch(e){}
}

async function createAccount(){
  const name=document.getElementById('name').value.trim();
  const pass=document.getElementById('pass').value.trim();
  if(!name){ msg('اكتب اسمك الأول','err'); return; }
  if(!/^\d{6}$/.test(pass)){ msg('الرقم السري لازم 6 أرقام بالظبط','err'); return; }
  try{
    const users=getUsers();
    const ex=users.find(u=>normalizeName(u.name)===normalizeName(name));
    const pHash=await passwordHash(name,pass);
    const scope=await accountScope(name,pass);
    if(ex){
      const valid=ex.passHash ? ex.passHash===pHash : ex.pass===pass;
      if(!valid){ msg('الاسم موجود بالفعل؛ اكتب الرقم السري الصحيح للحساب.','err'); return; }
      ex.name=ex.name||name;
      ex.passHash=pHash;
      ex.accountKey=scope;
      delete ex.pass;
    }else{
      users.push({name,passHash:pHash,accountKey:scope});
    }
    saveUsers(users);
    localStorage.setItem(SESSION_KEY,JSON.stringify({name:ex?ex.name:name,accountKey:scope}));
    await sendForm(ex?ex.name:name);
    msg('تم ✨ جاري الدخول...','ok');
    setTimeout(()=>enter(ex?ex.name:name),300);
  }catch(e){ msg(e && e.message ? e.message : 'حصل خطأ أثناء حفظ الحساب. حاول مرة أخرى.','err'); }
}

function enter(name){
  document.getElementById('authScreen').style.display='none';
  const ws=document.getElementById('welcomeScreen');
  ws.style.display='flex';
  document.getElementById('welcomeName').textContent='أهلا '+name;
  document.getElementById('topName').textContent=name;
  document.getElementById('av').textContent=name.charAt(0);
  setTimeout(()=>{
    ws.style.display='none';
    document.getElementById('platform').style.display='flex';
  }, 1100);
}

function logout(){ localStorage.removeItem(SESSION_KEY); location.reload(); }

window.addEventListener('DOMContentLoaded',async ()=>{
  try{
    const sess=JSON.parse(localStorage.getItem(SESSION_KEY)||'null');
    if(!sess || !sess.name) return;
    const users=getUsers();
    const user=users.find(u=>normalizeName(u.name)===normalizeName(sess.name));
    if(!user) return;
    let scope=sess.accountKey;
    // ترحيل آمن للحسابات والجلسات القديمة التي كانت تخزن الرقم السري كنص.
    if(sess.pass && /^\d{6}$/.test(sess.pass)){
      const pHash=await passwordHash(user.name,sess.pass);
      if(user.passHash ? user.passHash!==pHash : user.pass!==sess.pass) return;
      scope=await accountScope(user.name,sess.pass);
      user.passHash=pHash; user.accountKey=scope; delete user.pass; saveUsers(users);
      localStorage.setItem(SESSION_KEY,JSON.stringify({name:user.name,accountKey:scope}));
    }else if(!scope || !user.accountKey || scope!==user.accountKey){
      return;
    }
    document.getElementById('authScreen').style.display='none';
    document.getElementById('welcomeScreen').style.display='flex';
    document.getElementById('welcomeName').textContent='أهلا '+user.name;
    document.getElementById('topName').textContent=user.name;
    document.getElementById('av').textContent=user.name.charAt(0);
    setTimeout(()=>{
      document.getElementById('welcomeScreen').style.display='none';
      document.getElementById('platform').style.display='flex';
    },700);
  }catch(e){ /* اترك شاشة الدخول ظاهرة عند تعذر استعادة الجلسة */ }
});

document.getElementById('pass')?.addEventListener('input', function(){ this.value=this.value.replace(/\D/g,'').slice(0,6); });
</script>
