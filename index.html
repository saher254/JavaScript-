<style>
:root{--bg:#0b1220;--text:#e8eefc;--muted:#9fb0cf;--line:#24304a}
*{box-sizing:border-box;margin:0}
body{font-family:"Cairo","Segoe UI",Tahoma,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;line-height:1.7;
 background-image:radial-gradient(900px 500px at 85% -10%,#0b6bcb44,transparent),radial-gradient(800px 500px at 0% 110%,#f5a00033,transparent)}
.home{max-width:760px;margin:0 auto;padding:44px 18px 40px;min-height:100vh;display:flex;flex-direction:column}
.brand{text-align:center;margin-bottom:34px}
.brand .logo{display:inline-grid;place-items:center;width:64px;height:64px;border-radius:20px;font-size:26px;font-weight:900;direction:ltr;
 background:linear-gradient(135deg,#0b6bcb,#00a3ff);box-shadow:0 10px 30px #0b6bcb66;margin-bottom:12px}
.brand h1{font-size:clamp(26px,6vw,38px);font-weight:900}
.brand p{color:var(--muted);font-size:16px}
.cards{display:flex;flex-direction:column;gap:20px;flex:1}
.card{all:unset;box-sizing:border-box;cursor:pointer;position:relative;overflow:hidden;border-radius:28px;padding:30px 26px;color:#fff;
 display:flex;align-items:center;gap:20px;min-height:170px;transition:transform .25s,box-shadow .25s}
.card:hover,.card:focus-visible{transform:translateY(-5px) scale(1.01)}
.card:focus-visible{outline:3px solid #fff}
.card.js{background:linear-gradient(135deg,#7a5c00,#f5a000 60%,#ffd24d);box-shadow:0 18px 40px #f5a00044}
.card.bac{background:linear-gradient(135deg,#0a4aa6,#0b6bcb 55%,#00a3ff);box-shadow:0 18px 40px #0b6bcb55}
.card::after{position:absolute;left:-8px;bottom:-34px;font-size:120px;font-weight:900;opacity:.12;direction:ltr;pointer-events:none}
.card.js::after{content:"JS"}
.card.bac::after{content:"</>"}
.card .ico{flex:none;width:76px;height:76px;border-radius:22px;display:grid;place-items:center;font-size:38px;background:#ffffff2e;backdrop-filter:blur(6px)}
.card .tx{flex:1}
.card .tx small{display:block;font-weight:800;font-size:14px;opacity:.9}
.card .tx b{display:block;font-size:clamp(20px,5vw,27px);font-weight:900;line-height:1.4;margin:2px 0 6px}
.card .tx span{font-size:14.5px;opacity:.92}
.card .go{font-size:34px;transition:transform .25s}
.card:hover .go{transform:translateX(-8px)}
footer{text-align:center;color:var(--muted);font-size:13px;margin-top:30px}
footer a{color:inherit}
</style>
